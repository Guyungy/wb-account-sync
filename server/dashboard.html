<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkBuddy 每日看板</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1e3428;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:36px 22px 70px}.top{display:flex;align-items:start;justify-content:space-between;gap:20px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#46845d;font-weight:800}.top h1{font-size:38px;letter-spacing:-.05em;margin:7px 0}.lead{color:#718175;margin:0}.badge{font-size:12px;border-radius:100px;background:#e4f2e6;color:#2a7850;padding:9px 13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}.metric,.card,.trend,.note{background:white;border:1px solid #e1eae1;border-radius:18px;box-shadow:0 8px 26px #153c1f08}.metric{padding:20px}.metric small{color:#788b7c;display:block}.metric strong{display:block;font-size:28px;margin-top:6px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px}.section-head h2{font-size:20px;margin:0}.section-head span{font-size:12px;color:#839387}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{padding:21px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-size:20px;font-weight:750}.status{font-size:12px;border-radius:8px;padding:6px 10px;background:#e7f4e9;color:#257548}.status.pending{background:#fff3e4;color:#9a6924}.credit{background:#f3f9f4;border-radius:12px;margin:16px 0;padding:14px}.credit small{color:#718675}.credit strong{display:block;color:#276f48;font-size:26px}.credit span,.foot{font-size:12px;color:#829388}.progress{height:7px;background:#eaf0ea;border-radius:7px;overflow:hidden;margin:17px 0 7px}.progress i{display:block;height:100%;background:#4ba66e}.row{display:flex;justify-content:space-between;font-size:13px;color:#637a69}.remain{color:#6d7f70;font-size:12px;margin:12px 0}.foot{margin-top:14px}.trend{padding:23px;margin-top:17px}.trend-head{display:flex;justify-content:space-between;align-items:center;gap:14px}.trend-head h2{margin:0;font-size:20px}.trend-head select{font:inherit;border:1px solid #dce9dd;border-radius:9px;padding:8px 12px;color:#304f37;background:white}.trend-metrics{display:flex;gap:12px;margin:19px 0}.trend-metrics div{flex:1;background:#f4f9f4;border-radius:11px;padding:13px}.trend-metrics small{display:block;color:#819187}.trend-metrics strong{font-size:21px}.chart{display:flex;align-items:end;gap:7px;height:165px;border-bottom:1px solid #dce8df}.chart-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:4px}.chart-bar{width:min(30px,80%);min-height:2px;border-radius:5px 5px 0 0;background:linear-gradient(#83ca98,#268858)}.chart-col small{font-size:10px;color:#819188;white-space:nowrap}.daily-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}.daily-table th,.daily-table td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf2ed}.daily-table th{color:#819188;font-weight:500}.note{margin-top:17px;padding:17px 20px;color:#718175;font-size:13px;line-height:1.7}.error{color:#aa4637}@media(max-width:700px){.wrap{padding:25px 16px}.top{display:block}.badge{display:inline-block;margin-top:13px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:last-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.trend-metrics{flex-wrap:wrap}.trend-metrics div{min-width:45%}.daily-table{font-size:11px}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="eyebrow">WORKBUDDY DAILY</div><h1>每日签到看板</h1><p class="lead">签到、成长任务与积分变化，每天都留一份记录。</p></div><span class="badge" id="fresh">读取中…</span></header>
<section class="metrics"><div class="metric"><small>已配置账号</small><strong id="count">—</strong></div><div class="metric"><small>今日签到</small><strong id="signed">—</strong></div><div class="metric"><small>每日自动运行</small><strong>3 次</strong></div></section>
<div class="section-head"><h2>账号状态</h2><span>北京时间 · 最近一次运行</span></div><section class="grid" id="cards"></section>
<section class="trend"><div class="trend-head"><h2>每日数据</h2><select id="selected" aria-label="选择账号"></select></div><div class="trend-metrics" id="trend-metrics"></div><div class="chart" id="chart"></div><div style="overflow-x:auto"><table class="daily-table"><thead><tr><th>日期</th><th>签到</th><th>剩余积分</th><th>已用积分</th><th>成长任务</th></tr></thead><tbody id="daily-rows"></tbody></table></div></section>
<div class="note">自动运行时间：07:00、12:00、23:30。每日记录来自服务器运行日志；未运行或未查询成功时显示「暂无记录」。</div>
</main><script>
const $=id=>document.getElementById(id),num=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(n),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let history=[];
function renderDaily(){const rows=history.filter(r=>r.account===$('selected').value).sort((a,b)=>a.date.localeCompare(b.date)),latest=rows.at(-1),first=rows[0],delta=latest?.credits&&first?.credits?latest.credits.remaining-first.credits.remaining:null;$('trend-metrics').innerHTML=`<div><small>已记录天数</small><strong>${rows.length}</strong></div><div><small>最新剩余积分</small><strong>${latest?.credits?num(latest.credits.remaining):'—'}</strong></div><div><small>与首日相比</small><strong>${delta==null?'—':(delta>0?'+':'')+num(delta)}</strong></div>`;const recent=rows.slice(-14),max=Math.max(1,...recent.map(r=>r.credits?.remaining||0));$('chart').innerHTML=recent.length?recent.map(r=>`<div class="chart-col" title="${esc(r.date)} · ${r.credits?num(r.credits.remaining):'无数据'}"><div class="chart-bar" style="height:${r.credits?Math.max(3,Math.round(r.credits.remaining/max*130)):2}px"></div><small>${esc(r.date.slice(5))}</small></div>`).join(''):'<span class="lead">暂无每日记录</span>';$('daily-rows').innerHTML=rows.slice().reverse().slice(0,30).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.sign_in)}</td><td>${r.credits?num(r.credits.remaining):'—'}</td><td>${r.credits?num(r.credits.used):'—'}</td><td>${r.completed==null?'—':esc(r.completed)+' / '+esc(r.total)}</td></tr>`).join('')||'<tr><td colspan="5">暂无记录</td></tr>'}
$('selected').onchange=renderDaily;
async function update(){try{const [a,b]=await Promise.all([fetch('data.json?ts='+Date.now(),{cache:'no-store'}),fetch('history.json?ts='+Date.now(),{cache:'no-store'})]);if(!a.ok||!b.ok)throw Error('数据读取失败');const d=await a.json();history=(await b.json()).days||[];$('count').textContent=d.accounts.length;$('signed').textContent=d.accounts.filter(x=>/成功|已签到/.test(x.sign_in)).length;$('fresh').textContent='更新于 '+d.generated_at;$('cards').innerHTML=d.accounts.map(x=>{const pct=x.total?Math.min(100,Math.round(100*x.completed/x.total)):0,good=/成功|已签到/.test(x.sign_in);return `<article class="card"><div class="card-head"><span class="name">${esc(x.account)}</span><span class="status ${good?'':'pending'}">${esc(x.sign_in)}</span></div><div class="credit"><small>套餐剩余积分</small><strong>${x.credits?num(x.credits.remaining):'暂无记录'}</strong><span>${x.credits?`总额度 ${num(x.credits.total)} · 已用 ${num(x.credits.used)}`:'下次运行后更新'}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="row"><span>成长任务</span><b>${x.completed==null?'暂无记录':esc(x.completed)+' / '+esc(x.total)}</b></div><div class="remain">尚未完成：${x.remaining?.length?esc(x.remaining.join('、')):'暂无'}</div><div class="foot">最近运行：${esc(x.last_run||'暂无')} · 等级 ${esc(x.level??'—')}</div></article>`}).join('');const old=$('selected').value;$('selected').innerHTML=d.accounts.map(x=>`<option>${esc(x.account)}</option>`).join('');if(d.accounts.some(x=>x.account===old))$('selected').value=old;renderDaily()}catch(e){$('fresh').textContent='读取失败';$('cards').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
update();setInterval(update,60000);
</script></body></html>
