<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkBuddy 账号管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1d3327;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:36px 20px 80px}header{display:flex;justify-content:space-between;align-items:start;gap:18px}h1{font-size:36px;letter-spacing:-.04em;margin:8px 0}h2{font-size:20px;margin:0}.eyebrow{font-size:12px;letter-spacing:.18em;color:#408557;font-weight:800}.muted{color:#718476;font-size:14px;line-height:1.7}.nav{display:flex;gap:9px;flex-wrap:wrap}.nav a,.button{border:1px solid #d5e5d9;border-radius:11px;background:#fff;color:#286d43;padding:10px 15px;text-decoration:none;font:inherit;font-size:14px;cursor:pointer}.button.primary{background:#23764a;color:white;border-color:#23764a}.button.danger{color:#a04436;border-color:#efdbd7}.button:disabled{opacity:.55;cursor:wait}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:28px 0}.stat,.panel{background:white;border:1px solid #e0eae1;border-radius:19px;box-shadow:0 8px 26px #153c1f08}.stat{padding:20px}.stat small{color:#839286}.stat strong{display:block;font-size:29px;margin-top:7px}.panel{padding:23px;margin-top:17px}.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#f7faf7;border:1px solid #edf2ed;border-radius:13px;padding:13px 15px}.item strong{display:block}.item small{display:block;color:#829187;margin-top:4px}.item-actions{display:flex;gap:7px;align-items:center}.status{font-size:12px;padding:5px 9px;border-radius:8px;background:#e4f3e8;color:#277b4d}.status.wait{background:#fff2dc;color:#9a6b20}.url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:600px;font-size:13px;color:#476e54}.empty{color:#8a9a8c;padding:15px 0}.message{min-height:20px;color:#2e8051;font-size:13px}.error{color:#b34837}@media(max-width:700px){header{display:block}.nav{margin-top:17px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.item{align-items:start;flex-direction:column}.url{max-width:calc(100vw - 90px)}.section{align-items:start}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">WORKBUDDY · OWNER</div><h1>账号管理</h1><p class="muted">邀请朋友加入，查看受邀账号，并管理挂机状态。</p></div><nav class="nav"><a href="/workbuddy/">每日数据</a><a href="/workbuddy/join/">受邀页面</a></nav></header>
<section class="stats"><div class="stat"><small>受邀账号</small><strong id="accounts-count">—</strong></div><div class="stat"><small>待生效</small><strong id="queued-count">—</strong></div><div class="stat"><small>可用邀请</small><strong id="invites-count">—</strong></div></section>
<section class="panel"><div class="section"><div><h2>邀请链接</h2><div class="muted">每条链接仅可用于一个新账号；加入时还需手机号验证码。</div></div><button class="button primary" id="create">生成邀请链接</button></div><div class="list" id="invites"></div><p class="message" id="message"></p></section>
<section class="panel"><div class="section"><div><h2>受邀账号</h2><div class="muted">账号会在下一次自动运行前生效。</div></div><button class="button" id="refresh">刷新</button></div><div class="list" id="accounts"></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=n=>new Date(n*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const state=s=>({queued:'待生效',active:'运行中',removing:'移除中'})[s]||s;
async function api(path,body){const res=await fetch('/workbuddy/api/admin/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const out=await res.json();if(!res.ok)throw Error(out.error||'操作失败');return out}
async function load(){try{const d=await api('state');$('accounts-count').textContent=d.accounts.length;$('queued-count').textContent=d.accounts.filter(x=>x.state==='queued').length;$('invites-count').textContent=d.invites.length+d.unlisted_invites;$('invites').innerHTML=d.invites.map((x,i)=>`<div class="item"><div><strong>邀请 ${i+1}</strong><small>${date(x.created_at)} 生成</small><div class="url">${esc(x.url)}</div></div><button class="button copy" data-url="${esc(x.url)}">复制链接</button></div>`).join('')+(d.unlisted_invites?`<div class="muted">另有 ${d.unlisted_invites} 条旧邀请保存在此前的邀请文件中。</div>`:'')||'<div class="empty">还没有可用邀请，点击右上方生成。</div>';$('accounts').innerHTML=d.accounts.map(x=>{const cr=x.latest?.credits?.remaining;return `<div class="item"><div><strong>${esc(x.phone)}</strong><small>${date(x.created_at)} 加入 · ${x.latest?'最近剩余积分 '+esc(cr??'暂无记录'):'等待首次运行'}</small></div><div class="item-actions"><span class="status ${x.state==='active'?'':'wait'}">${esc(state(x.state))}</span><button class="button danger remove" data-id="${esc(x.account_id)}" ${x.state==='removing'?'disabled':''}>移除</button></div></div>`}).join('')||'<div class="empty">暂时没有受邀账号。</div>'}catch(e){$('message').textContent=e.message;$('message').className='message error'}}
$('create').onclick=async()=>{const btn=$('create');btn.disabled=true;try{await api('invites',{count:1});$('message').textContent='邀请链接已生成，可以复制发送。';$('message').className='message';await load()}catch(e){$('message').textContent=e.message;$('message').className='message error'}finally{btn.disabled=false}};
$('refresh').onclick=load;document.addEventListener('click',async e=>{const copy=e.target.closest('.copy');if(copy){try{await navigator.clipboard.writeText(copy.dataset.url);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制链接',1800)}catch{$('message').textContent='复制失败，请手动选中链接复制'}}const remove=e.target.closest('.remove');if(remove&&confirm('确定移除这个账号？移除后它将停止挂机。')){remove.disabled=true;try{await api('remove',{account_id:remove.dataset.id});await load()}catch(err){alert(err.message);remove.disabled=false}}});load();
</script></body></html>
