<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加入 WorkBuddy 每日签到</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#20372a;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}.shell{max-width:820px;margin:auto;padding:48px 20px 80px}.brand{font-size:12px;letter-spacing:.16em;color:#428260;font-weight:800}.hero h1{font-size:clamp(29px,5vw,43px);letter-spacing:-.05em;margin:10px 0}.hero p{color:#6e8073;line-height:1.8;margin:0}.card{background:#fff;border:1px solid #e0e9df;border-radius:20px;padding:27px;margin-top:27px;box-shadow:0 12px 38px #174a250a}.card h2{margin:0 0 7px;font-size:20px}.muted{color:#7b8b7d;font-size:13px;line-height:1.7}.fields{display:grid;gap:16px;margin:23px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}.field input{display:block;width:100%;border:1px solid #d8e5da;background:#fbfdfb;border-radius:11px;padding:12px 13px;font:inherit;font-size:15px;outline:none}.field input:focus{border-color:#54a877;box-shadow:0 0 0 3px #61b68122}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .field{flex:1;min-width:180px}button{border:0;border-radius:11px;padding:12px 19px;font:inherit;font-weight:650;cursor:pointer;background:#2d8d5e;color:white}button.secondary{background:#eaf5ed;color:#26734b}button.quiet{background:transparent;color:#567763;padding:8px 0}button.danger{background:#fcecea;color:#ad4840}button:disabled{opacity:.5;cursor:default}.notice{font-size:13px;padding:11px 13px;border-radius:10px;background:#e9f5eb;color:#287149;margin-top:15px}.notice.error{background:#fff0ed;color:#a6483e}.account{border:1px solid #e5ebe5;border-radius:14px;padding:17px;margin-top:12px}.account-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.account-head strong{font-size:17px}.state{font-size:12px;color:#2c8354;background:#e6f5ea;padding:5px 9px;border-radius:8px}.state.wait{color:#9b6725;background:#fff3df}.statline{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.statline span{flex:1;min-width:120px;background:#f4f9f4;padding:12px;border-radius:10px;color:#76877a;font-size:12px}.statline b{display:block;color:#263c2c;font-size:18px;margin-top:4px}.chart{display:flex;align-items:end;gap:5px;height:95px;border-bottom:1px solid #e3ebe4}.bar{flex:1;background:linear-gradient(#85cda0,#2d9560);min-width:5px;border-radius:4px 4px 0 0}.days{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px;color:#819286;font-size:12px}.fine{color:#88978a;font-size:12px;line-height:1.8;margin-top:20px}.top-actions{display:flex;justify-content:space-between;align-items:center;gap:15px}.hidden{display:none!important}@media(max-width:600px){.shell{padding:30px 15px}.card{padding:20px}.top-actions{display:block}}
</style></head><body><main class="shell"><div class="hero"><div class="brand">WORKBUDDY DAILY</div><h1>让签到每天自动完成</h1><p>使用自己的手机号接收 WorkBuddy 验证码，授权后由服务器定时运行。你只能查看和管理自己添加的账号。</p></div>
<section class="card" id="login"><h2>添加或登录账号</h2><div class="muted">首次添加需要邀请码；已有账号可直接用手机验证码登录。</div><div class="fields"><div class="field"><label for="invite">邀请码（首次添加）</label><input id="invite" autocomplete="off" placeholder="填入邀请人发给你的代码"></div><div class="field"><label for="phone">WorkBuddy 手机号</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="大陆手机号或香港 8 位号码"></div><div class="row"><div class="field"><label for="code">短信验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="收到后填写"></div><button class="secondary" id="send">获取验证码</button></div></div><button id="verify">验证并添加账号</button><div id="message"></div><p class="fine">授权信息只用于在这台服务器上完成定时任务。请勿在聊天中发送验证码、访问令牌或刷新令牌。</p></section>
<section class="card hidden" id="account-panel"><div class="top-actions"><div><h2>我的账号</h2><div class="muted">签到每天运行三次；这里保留最近 30 天的记录。</div></div><button class="quiet" id="logout">退出登录</button></div><div id="accounts"></div><div id="panel-message"></div><button class="secondary" id="add-another" style="margin-top:18px">添加另一个账号</button></section>
</main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(n);let csrf='',adding=false;
const invite=new URLSearchParams(location.search).get('invite');if(invite)$('invite').value=invite;
function notice(id,text,error=false){$(id).innerHTML=text?`<div class="notice ${error?'error':''}">${esc(text)}</div>`:''}
async function api(path,data){const response=await fetch('api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,credentials:'same-origin'});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result}
function renderAccount(a){const days=(a.days||[]).slice().reverse(),latest=days.at(-1),credit=latest?.credits,max=Math.max(1,...days.map(x=>x.credits?.remaining||0));return `<article class="account"><div class="account-head"><strong>${esc(a.phone)}</strong><span class="state ${a.state==='active'?'':'wait'}">${a.state==='active'?'自动运行中':a.state==='removing'?'正在移除':'即将生效'}</span></div><div class="statline"><span>最近签到<b>${esc(latest?.sign_in||'暂无记录')}</b></span><span>剩余积分<b>${credit?num(credit.remaining):'—'}</b></span><span>成长任务<b>${latest?.completed==null?'—':esc(latest.completed)+' / '+esc(latest.total)}</b></span></div><div class="chart">${days.length?days.map(d=>`<div class="bar" title="${esc(d.date)} · ${d.credits?num(d.credits.remaining):'暂无积分'}" style="height:${d.credits?Math.max(3,Math.round(d.credits.remaining/max*85)):2}px"></div>`).join(''):'<div class="muted">运行后会显示每日积分变化</div>'}</div><div class="days">${days.slice(-7).map(d=>`<span>${esc(d.date.slice(5))} ${d.credits?num(d.credits.remaining):'—'}</span>`).join('')}</div><button class="quiet danger" data-remove="${esc(a.account_id)}" style="margin-top:10px">停止并移除</button></article>`}
async function refresh(){try{const me=await api('me');$('account-panel').classList.toggle('hidden',!me.authenticated);$('login').classList.toggle('hidden',!!me.authenticated&&!adding);if(me.authenticated){csrf=me.csrf;$('accounts').innerHTML=me.accounts.length?me.accounts.map(renderAccount).join(''):'<p class="muted">还没有账号。</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('停止这个账号的自动运行并移除？'))return;try{await api('remove',{account_id:b.dataset.remove,csrf});await refresh()}catch(e){notice('panel-message',e.message,true)}})}}catch(e){notice('message',e.message,true)}}
$('send').onclick=async()=>{const b=$('send');b.disabled=true;try{const r=await api('send',{phone:$('phone').value,invite:$('invite').value});notice('message',r.message)}catch(e){notice('message',e.message,true)}finally{b.disabled=false}};
$('verify').onclick=async()=>{const b=$('verify');b.disabled=true;try{const r=await api('verify',{phone:$('phone').value,code:$('code').value});notice('message',r.message);await refresh()}catch(e){notice('message',e.message,true)}finally{b.disabled=false}};
$('logout').onclick=async()=>{await api('logout',{});await refresh()};$('add-another').onclick=()=>{adding=true;$('login').classList.remove('hidden');$('login').scrollIntoView({behavior:'smooth'})};refresh();setInterval(refresh,60000);
</script></body></html>
