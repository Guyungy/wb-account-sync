[package]
name = "wb-core"
description = "WorkBuddy 跨 App 数据目录打通的迁移引擎（plan_id 指纹、计划、执行、核验）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sha2.workspace = true

# serde_json 只用来**读**外部 JSON（账号快照、settings.json、undo.json）。
# 写出去的一律走自家的 pyjson —— 标准库的分隔符与浮点规则跟 CPython 不同，
# 哈希差一个字节就是完全不同的一串。
# preserve_order 是必需的：settings.json 做渠道并集时要保住原有键序。
serde_json = { version = "1", features = ["preserve_order"] }

# bundled = 自带 SQLite 源码。不依赖系统库，打包成单文件时省心；
# 代价是首次编译慢一点（实测本机约 4 秒，可以接受）。
rusqlite = { version = "0.40.2", features = ["bundled"] }

# 只为了拿本地时区偏移（created_at 的 `+0800`）。标准库没有稳定的本地时间接口。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# 集成测试要读 golden 夹具、并把夹具回放进临时目录，需要直接 use serde_json。
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
