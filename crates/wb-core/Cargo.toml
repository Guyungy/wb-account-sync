[package]
name = "wb-core"
description = "WorkBuddy 跨 App 数据目录打通的迁移引擎（plan_id 指纹、计划、执行、核验）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sha2.workspace = true

# serde_json 只用来**读**外部 JSON（账号快照、settings.json、undo.json）。
# 写出去的一律走自家的 pyjson —— 标准库的分隔符与浮点规则跟 CPython 不同，
# 哈希差一个字节就是完全不同的一串。
# preserve_order 是必需的：settings.json 做渠道并集时要保住原有键序。
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
