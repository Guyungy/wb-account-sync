name: Safety preview CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Validate source launcher
        run: |
          bash -n wb-account-sync.sh
          WB_PYTHON="$(command -v python)" ./wb-account-sync.sh --version
          python wb-account-sync.py --help
      - name: Verify legacy writes are refused
        run: |
          python - <<'PY'
          import subprocess
          import sys
          result = subprocess.run([sys.executable, 'wb-account-sync.py', 'live'], capture_output=True)
          assert result.returncode == 2
          PY
  # Rust 是当前主底座（2026-09-21 起），从 P1 的 pyjson 开始就纳入门禁。
  # 刻意不引第三方 action：GitHub 的 ubuntu runner 自带稳定版 Rust，
  # 少一个 action 就少一处需要盯 SHA 的供应链面。
  # 它守的是 plan_id：夹具由 CPython 生成（见上面 test job 的夹具校验），
  # 这里证明 Rust 的编码与 CPython 逐字节一致。
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Rust tests
        run: cargo test --workspace --locked
  package:
    needs: [test, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build installable distributions
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/wb-preview-smoke
          /tmp/wb-preview-smoke/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/wb-preview-smoke/bin/wb-account-sync --version
          /tmp/wb-preview-smoke/bin/wb-account-sync --help
      - name: Compute checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = sorted(p for p in Path('dist').iterdir() if p.suffix == '.whl' or p.name.endswith('.tar.gz'))
          Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in paths))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-account-sync-safety-preview
          path: dist/
          retention-days: 30
          if-no-files-found: error
